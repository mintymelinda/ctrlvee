version: "3.7"

services:
  vlc-test:
    build:
      context: ..
      dockerfile: Dockerfile.vlc-test
    image: ctrlvee-vlc-test:local
    container_name: ctrlvee-vlc-test
    init: true
    restart: unless-stopped
    environment:
      VLC_TEST_PASSWORD: ${VLC_TEST_PASSWORD:?Set VLC_TEST_PASSWORD in .env}
    ports:
      # Keep the VLC control API local to the Synology host.
      - "127.0.0.1:18080:8080"
    volumes:
      # VLC reads the dedicated fixtures; it never modifies their bytes.
      - /volume1/docker/ctrlvee-vlc-test/media:/media:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  actions-runner:
    build:
      context: ..
      dockerfile: Dockerfile.actions-runner
    image: ctrlvee-actions-runner:local
    container_name: ctrlvee-actions-runner
    init: true
    restart: unless-stopped
    network_mode: host
    environment:
      RUNNER_MODE: run
    volumes:
      - actions-runner-data:/runner
      # Preserve the host path because the workflow checks this exact path.
      - /volume1/docker/ctrlvee-vlc-test/media:/volume1/docker/ctrlvee-vlc-test/media:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Entrypoint initializes volume ownership, then drops privileges.
      - CHOWN
      - SETGID
      - SETUID

volumes:
  actions-runner-data:
    name: ctrlvee-actions-runner-data
