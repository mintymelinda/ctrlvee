name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Mocked Discord and Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run mocked Discord and application unit tests
        run: python -m unittest discover --start-directory tests --pattern "test_*.py" --verbose

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build CtrlVee image
        run: docker build --tag ctrlvee:ci .

      - name: Validate Compose deployment configuration
        run: |
          cp template.env .env
          docker compose config --quiet

      - name: Build isolated remote VLC test image
        run: docker build --file Dockerfile.vlc-test --tag ctrlvee:vlc-test .

      - name: Build Debian Actions runner image
        run: docker build --file Dockerfile.actions-runner --tag ctrlvee:actions-runner .

      - name: Validate private remote VLC Compose configuration
        env:
          VLC_TEST_PASSWORD: ci-only-test-password
        run: docker compose --file ctrlvee-vlc-test/docker-compose.yml config --quiet

      - name: Validate private remote VLC configuration with legacy Compose V1
        run: |
          docker run --rm \
            --volume "$PWD:/work:ro" \
            --workdir /work \
            --env VLC_TEST_PASSWORD=ci-only-test-password \
            docker/compose:1.29.2 \
            --file ctrlvee-vlc-test/docker-compose.yml config --quiet

      - name: Smoke-test application imports in the built image
        run: |
          docker run --rm --entrypoint python ctrlvee:ci -c "
          import discord
          from src.config import Config
          from src.services.vlc_controller import VLCController
          from src.services.watch_folder_service import WatchFolderService
          from src.cogs.playback import PlaybackCommands
          from src.cogs.scheduler import Scheduler
          from src.cogs.watch import WatchCommands
          print(f'CtrlVee runtime imports OK (discord.py {discord.__version__})')
          "

  real-vlc-integration:
    name: Real VLC integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build integration image with headless VLC
        run: docker build --file Dockerfile.integration --tag ctrlvee:vlc-integration .

      - name: Verify integration image excludes the unused Qt interface
        run: |
          docker run --rm --entrypoint sh ctrlvee:vlc-integration -ec '
            cvlc --version
            if dpkg-query -s vlc-plugin-qt >/dev/null 2>&1; then
              echo "Unexpected Qt interface plugin in headless VLC test image"
              exit 1
            fi
          '

      - name: Run controller tests against real VLC
        run: docker run --rm ctrlvee:vlc-integration

      - name: Repeat concurrent VLC command test against the same image
        run: |
          docker run --rm --entrypoint cvlc ctrlvee:vlc-integration --version
          for attempt in 1 2 3; do
            echo "Concurrent command stability run ${attempt}/3"
            docker run --rm \
              --env PYTHONPATH=/app:/app/tests \
              --entrypoint python \
              ctrlvee:vlc-integration \
              -m unittest \
              test_vlc_real_integration.RealVLCIntegrationTests.test_real_vlc_concurrent_commands_use_serialized_controller_path \
              --verbose
          done

      - name: Repeat real VLC playlist navigation to detect timing flakes
        run: |
          for attempt in 1 2 3; do
            echo "Playlist navigation stability run ${attempt}/3"
            docker run --rm \
              --env PYTHONPATH=/app:/app/tests \
              --entrypoint python \
              ctrlvee:vlc-integration \
              -m unittest \
              test_vlc_real_integration.RealVLCIntegrationTests.test_real_vlc_playlist_navigation_and_repeat_modes \
              --verbose
          done

      - name: Run optional live Discord test-server checks
        env:
          DISCORD_TEST_BOT_TOKEN: ${{ secrets.DISCORD_TEST_BOT_TOKEN }}
          DISCORD_TEST_GUILD_ID: ${{ secrets.DISCORD_TEST_GUILD_ID }}
          DISCORD_TEST_TEXT_CHANNEL_ID: ${{ secrets.DISCORD_TEST_TEXT_CHANNEL_ID }}
          DISCORD_TEST_VOICE_CHANNEL_ID: ${{ secrets.DISCORD_TEST_VOICE_CHANNEL_ID }}
        run: |
          docker run --rm \
            -e DISCORD_TEST_BOT_TOKEN \
            -e DISCORD_TEST_GUILD_ID \
            -e DISCORD_TEST_TEXT_CHANNEL_ID \
            -e DISCORD_TEST_VOICE_CHANNEL_ID \
            --entrypoint python \
            ctrlvee:vlc-integration \
            tests/test_discord_live_integration.py
