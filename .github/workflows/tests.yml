name: Tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run unit tests
        run: python -m unittest discover --start-directory tests --pattern "test_*.py" --verbose

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build CtrlVee image
        run: docker build --tag ctrlvee:ci .

      - name: Validate Compose deployment configuration
        run: |
          cp template.env .env
          docker compose config --quiet

      - name: Smoke-test application imports in the built image
        run: |
          docker run --rm --entrypoint python ctrlvee:ci -c "
          from src.config import Config
          from src.services.vlc_controller import VLCController
          from src.services.watch_folder_service import WatchFolderService
          from src.cogs.playback import PlaybackCommands
          from src.cogs.scheduler import Scheduler
          from src.cogs.watch import WatchCommands
          print('CtrlVee runtime imports OK')
          "

  real-vlc-integration:
    name: Real VLC integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build integration image with headless VLC
        run: docker build --file Dockerfile.integration --tag ctrlvee:vlc-integration .

      - name: Run controller tests against real VLC
        run: docker run --rm ctrlvee:vlc-integration
