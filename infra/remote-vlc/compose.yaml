services:
  vlc-test:
    build:
      context: ../..
      dockerfile: Dockerfile.vlc-test
    image: ctrlvee-vlc-test:local
    container_name: ctrlvee-vlc-test
    restart: unless-stopped
    environment:
      VLC_TEST_PASSWORD: ${VLC_TEST_PASSWORD:?Set VLC_TEST_PASSWORD in the environment}
    ports:
      # The control interface is intentionally reachable only from the Synology host.
      - "127.0.0.1:18080:8080"
    volumes:
      # The native GitHub runner writes fixtures here; VLC reads the same files at /media.
      - ${VLC_TEST_MEDIA_DIR:-./media}:/media:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
